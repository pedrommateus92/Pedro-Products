<h1>Products</h1>

@if (loading()) {
  <mat-progress-bar mode="indeterminate" />
} @else if (error(); as message) {
  <p class="error" role="alert">{{ message }}</p>
} @else if (products().length === 0) {
  <p>No products yet.</p>
} @else {
  <table mat-table [dataSource]="products()" class="mat-elevation-z1">
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>ID</th>
      <td mat-cell *matCellDef="let product">{{ product.id }}</td>
    </ng-container>

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let product">{{ product.name }}</td>
    </ng-container>

    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef>Description</th>
      <td mat-cell *matCellDef="let product">{{ product.description }}</td>
    </ng-container>

    <ng-container matColumnDef="price">
      <th mat-header-cell *matHeaderCellDef class="numeric">Price</th>
      <td mat-cell *matCellDef="let product" class="numeric">{{ product.price | currency }}</td>
    </ng-container>

    <ng-container matColumnDef="stock">
      <th mat-header-cell *matHeaderCellDef class="numeric">Stock</th>
      <td mat-cell *matCellDef="let product" class="numeric">{{ product.stock }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns"></tr>
  </table>
}
